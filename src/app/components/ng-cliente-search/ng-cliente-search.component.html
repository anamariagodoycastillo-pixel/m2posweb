<div class="modal-background" *ngIf="isOpen" (click)="close()">
  <div class="modal-container"
    [ngClass]="{'small': size === 'small', 'medium': size === 'medium', 'large': size === 'large'}">
    <div class="modal-header">
      <h5 class="modal-title">Buscador de Cliente Sucursal</h5>
      <button type="button" class="btn-close" (click)="close()"> <fa-icon [icon]="faTimes"></fa-icon></button>
    </div>
    <!-- Contenido del modal -->
    <div (click)="$event.stopPropagation()">

        <div   id="basic-addon3">

          <div class="w-100 mb-3">
            <input-debounce  #inputSearch [delay]=delay id="inputSearch"
              type="text" placeholder="Ingrese el cliente buscado ..." required="" aria-invalid="false"
              (value)="buscar($event)" />
            </div>

        </div>
      <ul class="list-group">
        @for (cliente of clientes; track cliente.clienteSucursalId) {
        <li class="list-group-item" (click)="selectCliente(cliente)">
          <span class="text-center pointer" >
            {{cliente.nroDocumento}} - {{cliente.nombre}}
          </span>
        </li>
        } @empty {
        <li class="list-group-item">No se han encontrado items</li>
        }
      </ul>

    </div>


  </div>
</div>
