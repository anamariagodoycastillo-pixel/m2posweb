<div class="modal-background" *ngIf="isOpen" (click)="close()">
  <div class="modal-container medium" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h5 class="modal-title">{{ titulo }}</h5>
      <button type="button" class="btn-close" (click)="close()">
        <fa-icon [icon]="faTimes"></fa-icon>
      </button>
    </div>

    <div class="mb-3">
      <input
        type="text"
        class="form-control"
        placeholder="{{ placeholder }}"
        [(ngModel)]="valor"
      />
    </div>

    <div class="d-flex justify-content-end gap-2">
      <button class="btn btn-outline-secondary btn-sm" (click)="close()">Cancelar</button>
      <button class="btn btn-outline-primary btn-sm" (click)="aceptar()">Aceptar</button>
    </div>
  </div>
</div>
